# Разворачивание на berlin: rootless Docker, без sudo, порты 3000+.
#
# mem_limit обязателен: на машине около гигабайта свободной памяти и живут
# чужие сервисы. Лучше упасть самим, чем уронить соседа.
services:
  dira-bot:
    build: .
    container_name: dira-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/dira.db
      TZ: Asia/Jerusalem
    volumes:
      - ./data:/app/data
    mem_limit: 400m
    memswap_limit: 600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
