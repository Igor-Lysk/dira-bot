services:
  dira-bot:
    build: .
    container_name: dira-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data    # persist SQLite database
      # Read/write access to host docker socket so the bot can lazy-start /
      # stop the flaresolverr container on demand. Path is the rootless
      # docker socket on the Berlin VPS.
      - /var/run/docker/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Headless Chrome proxy that solves Cloudflare/Reblaze JS challenges.
  # NOT started by default — dira-bot starts it on demand via the docker
  # socket when all paid proxy providers fail, and stops it after 10 min
  # of idle. The `manual` profile excludes it from `docker compose up`.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: ["manual"]
    restart: "no"
    mem_limit: 900m
    memswap_limit: 900m
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Asia/Jerusalem
      BROWSER_TIMEOUT: "40000"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
